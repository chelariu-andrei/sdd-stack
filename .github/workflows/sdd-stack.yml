name: sdd-stack

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: sdd-stack-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      # Policy + scripts are always taken from the default branch,
      # so a PR cannot loosen the rules it is checked against.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce SDD stacked-PR policy
        run: node .github/sdd-stack/ci-check.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
